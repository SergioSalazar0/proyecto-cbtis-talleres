   <section class="form-register">
      <h4>Crea tu cuenta</h4>
      <p style="text-align: center; color: #ccc; margin-bottom: 20px;">
          Registra tu cuenta
      </p>
      <form id="registerForm">
          <input class="controls" type="email" name="email" id="email" placeholder="Correo Electrónico" required>
          <input class="controls" type="password" name="password" id="password" placeholder="Contraseña (mínimo 6 caracteres)" required>
          <input class="controls" type="text" name="numero_control" id="numero_control" placeholder="Número de Control" required>
          
          
          
          <button class="botons" type="submit">Crear mi cuenta</button>
          <p><a href="login.html">¿Ya tienes una cuenta?</a></p>
      </form>
  </section>


  <script src="./js/config.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>

      
      const registerForm = document.querySelector('#registerForm');
      
      // Al enviar el formulario
      registerForm.addEventListener('submit', async (e) => {
          e.preventDefault();

          const formData = {
              email: e.target.email.value,
              password: e.target.password.value,
              numero_control: e.target.numero_control.value
          };

          try {
              const response = await axios.post(`${API_BASE_URL}/auth/register`, formData);

              if (response.status === 201) {
                  const token = response.data.token;
                  
                  // Mostrar mensaje de éxito
                  alert(`¡Registro exitoso! ${response.data.message}`);
                  
                  // Guardar token y redirigir al login para que el usuario ingrese
                  localStorage.setItem('newUserToken', token);
                  localStorage.setItem('needsProfile', 'true');
                  
                  setTimeout(() => {
                      window.location.href = 'login.html';
                  }, 2000);
              }
          } catch (error) {
              console.error('Error al registrar:', error);
              
              if (error.response?.data?.details) {
                  const errores = error.response.data.details.map(err => err.message).join('\n');
                  alert(`Errores de validación:\n${errores}`);
              } else {
                  alert(error.response?.data?.message || 'Ocurrió un error, por favor intente más tarde.');
              }
          }
      });
  </script>
